source:
  kind: container
  repo: docker.io/library/ubuntu
select:
  kind: calver
  layout: "YY.0M"
  where:
    year: { mod: [2, 0] } # LTS is released every even year ...
    month: { in: [4] }    # ... in April
  last: 2
build:
  repo: ghcr.io/lesomnus/ubuntu
  tags:
    - "{{.Version}}"      # 24.04
    - "{{.Year}}"         # 24
  platforms:
    - linux/amd64
    - linux/arm64
